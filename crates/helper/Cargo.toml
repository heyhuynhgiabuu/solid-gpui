[package]
name = "solid-gpui-helper"
description = "Native GPUI window host for solid-gpui (out-of-process helper binary)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
solid-gpui-protocol = { path = "../protocol" }
futures = "0.3"
# Stock upstream gpui — no fork, no patches (ADR 002). Cargo.lock pins the
# exact commit on first resolve.
gpui = { git = "https://github.com/zed-industries/zed" }
# S7b captureFrame: cross-platform window capture (macOS CGWindowList under
# the hood). Helper-only dep; protocol/client stay zero-dep.
xcap = "0.9"
serde_json = "1"
# S13 markdown: block-level parsing only (Comet uses 0.12; matched to keep
# the port byte-compatible with upstream parser semantics).
pulldown-cmark = "0.12"
# macOS: Metal is always available; font-kit enables real glyph rasterization.
# Linux (Phase 2+): switch to features = ["wayland", "x11"].
gpui_platform = { git = "https://github.com/zed-industries/zed", features = [
    "font-kit",
] }
