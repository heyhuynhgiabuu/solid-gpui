# CI for solid-gpui.
#
# The headless helper tests run on Linux, Windows, and macOS. TypeScript
# suites are platform-independent and run on Linux.
#
# gui-evidence drives the real-window smokes on hosted runners with a window
# server (macOS WindowServer; Linux under Xvfb; Windows desktop session). It
# runs with continue-on-error while evidence is being collected: a red job
# means "not yet claimed", not "broken main". Per-OS support badges are
# recorded in ROADMAP.md only after these jobs pass.

name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run check:consumer-jsx
      - run: bun run check:consumer-h
      - run: bun run test

  rust:
    name: rust (macOS)
    runs-on: macos-14
    env:
      SOLID_GPUI_SKIP_GUI_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test -p solid-gpui-protocol -p solid-gpui-helper --locked

  rust-linux:
    name: rust (Linux, headless)
    runs-on: ubuntu-latest
    env:
      SOLID_GPUI_SKIP_GUI_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install GPUI Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libwayland-dev \
            libegl-dev \
            libgbm-dev \
            libpipewire-0.3-dev \
            libspa-0.2-dev \
            libclang-dev \
            libfontconfig1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test -p solid-gpui-protocol -p solid-gpui-helper --locked

  rust-windows:
    name: rust (Windows, headless)
    runs-on: windows-latest
    env:
      SOLID_GPUI_SKIP_GUI_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test -p solid-gpui-protocol -p solid-gpui-helper --locked

  node-smoke:
    # Real Node runtime against the compiled helper (needs the binary, hence
    # macOS; stdio mode opens no window).
    runs-on: macos-14
    env:
      SOLID_GPUI_SKIP_GUI_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p solid-gpui-helper
      - run: bun install --frozen-lockfile
      - run: bunx tsx scripts/node-smoke.ts
      - run: bun run smoke:consumer-jsx
      - run: bun run smoke:consumer-h

  gui-evidence:
    name: gui-evidence (${{ matrix.os == 'macos-14' && 'macOS' || matrix.os == 'ubuntu-latest' && 'Linux, Xvfb' || 'Windows' }})
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-latest, windows-latest]
    env:
      SOLID_GPUI_SKIP_GUI_TESTS: "1"
      SOLID_GPUI_GATE0_GUI: "1"
      SOLID_GPUI_GATE3_GUI: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install GPUI Linux build dependencies + Xvfb
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libwayland-dev \
            libegl-dev \
            libgbm-dev \
            libpipewire-0.3-dev \
            libspa-0.2-dev \
            libclang-dev \
            libfontconfig1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxcb-cursor0 \
            libgl1 \
            xvfb \
            openbox
      - run: cargo build -p solid-gpui-helper
      - run: bun install --frozen-lockfile
      - name: consumer-h GUI smoke (real window)
        if: runner.os != 'Linux'
        run: bun run smoke:consumer-h
      - name: consumer-h GUI smoke (real window, Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a bun run smoke:consumer-h
      - name: gate3 overlay GUI smoke (real window)
        if: runner.os != 'Linux'
        run: bun run smoke:gate3-gui
      - name: gate3 overlay GUI smoke (real window, Xvfb + openbox)
        if: runner.os == 'Linux'
        # A window manager is required for focus-transfer semantics: a bare
        # Xvfb display never focuses the window, so the overlay autofocus
        # never fires. openbox is the smallest honest stand-in.
        run: xvfb-run -a bash -lc 'openbox & sleep 2; exec bun run smoke:gate3-gui' 
